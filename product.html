<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="product-detail-wrapper">
      <div class="product-detail-left" id="product-image-section"></div>
      <div class="product-detail-right" id="product-info-section"></div>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");

      async function fetchProductDetail(id) {
        const response = await fetch(`https://dummyjson.com/products/${id}`);
        const product = await response.json();
        displayProductDetail(product);
      }

      function displayProductDetail(product) {
        // Left: Image section
        document.getElementById("product-image-section").innerHTML = `
        <div class="product-image-box">
          <img src="${product.thumbnail}" alt="${product.title}" class="main-product-image">
        </div>
      `;
        // Right: Info section
        document.getElementById("product-info-section").innerHTML = `
        <div class="product-info-box">
          <div class="product-price">$ ${product.price.toLocaleString()}</div>
          <div class="product-title">${product.title}</div>
          <div class="product-location"><span>📍</span> ${product.brand}</div>
          <div class="product-description">${product.description}</div>
          <div class="product-meta">
            <span>⭐ ${product.rating}</span> | <span>Stock: ${product.stock}</span>
          </div>
          <div class="seller-box">
            <div class="seller-avatar"></div>
            <div>
              <div class="seller-name">Posted by Demo Seller</div>
              <div class="seller-since">Member Since 2021</div>
            </div>
          </div>
          <button class="contact-btn">Show phone number</button>
          <button class="chat-btn">Chat</button>
         
        </div>
      `;
      }

      if (productId) fetchProductDetail(productId);

      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      }
    </script>
  </body>
</html>
